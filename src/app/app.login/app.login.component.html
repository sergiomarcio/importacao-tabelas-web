@if (spinnerVisivel) {
  <div class="spinner-overlay" role="status" aria-live="polite">
    <div class="spinner-container">
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      <p>Autenticando...</p>
    </div>
  </div>
}
<div class="login-container">
  <div class="login-background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="login-card">
    <div class="login-header" style="margin: 0;">
      <img src="assets/images/marca_stj.png" alt="STJ" class="logo" />
    </div>

    <div class="login-header">
      <h1 class="login-project-name">Importação de Tabelas do SARH / Telesystem / Integra</h1>
    </div>

    <form [formGroup]="loginFormGroup" (ngSubmit)="fazerLogin()" class="login-form">
      <div class="input-group">
        <span class="input-icon">
          <i class="pi pi-user"></i>
        </span>
        <input type="text" id="usuario" formControlName="usuario" placeholder="Usuário" aria-label="Usuário" autocomplete="username"
           />
      </div>

      <div class="input-group">
        <span class="input-icon">
          <i class="pi pi-lock"></i>
        </span>
        <input [type]="mostrarSenha ? 'text' : 'password'" id="password" formControlName="password" placeholder="Senha"
          autocomplete="current-password" aria-label="Senha"  />
        <button type="button" class="input-eye-toggle" [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'" (click)="mostrarSenha = !mostrarSenha">
          <i [class]="mostrarSenha ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </div>

      <button type="submit" class="login-button" [disabled]="spinnerVisivel || !loginFormGroup.valid">
        @if (!spinnerVisivel) {
        <span>Entrar</span>
        }
        @if (spinnerVisivel) {
        <i class="pi pi-spin pi-spinner"></i>
        }
      </button>

          @if (isLocalhost) {
        <button type="button" class="login-button" (click)="entrarDesenvolvimento()" [disabled]="spinnerVisivel">
          Entrar em desenvolvimento local
        </button>
      }
    </form>

  </div>
</div>
